# Construit le catalogue de voix open source : chaque voix candidate est testée en parallèle
# (français + arabe, vérification de la prononciation avec Whisper) et seules les voix
# qui prononcent correctement sont gardées, avec leurs extraits d'écoute.
name: Catalogue des voix

on:
  push:
    paths:
      - "voixoff/candidates.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.l.outputs.idx }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "idx=$(python3 -c 'import json;print(json.dumps(list(range(len(json.load(open("voixoff/candidates.json")))))))')" >> "$GITHUB_OUTPUT"

  screen:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        idx: ${{ fromJSON(needs.list.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voixoff/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v2-whisper
          restore-keys: chatterbox-mtl-v2
      - run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r voixoff/requirements.txt faster-whisper scipy
      - run: python voixoff/screen_voice.py ${{ matrix.idx }} out
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.idx }}
          path: out/
          retention-days: 2

  catalogue:
    needs: screen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: python3 voixoff/build_catalogue.py results docs/voices
      - name: Enregistrer le catalogue
        run: |
          git config user.name "DianaVoiceStudio"
          git config user.email "actions@users.noreply.github.com"
          git add docs/voices voixoff/voices.json
          git commit -m "Catalogue des voix open source mis à jour" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
